[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-credential-platform"
version = "0.1.0"
description = "Hybrid AI agent platform for privacy-preserving credential verification and matching."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Johnson" }]
keywords = ["a2a", "mcp", "did", "verifiable-credentials", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "mcp>=2,<3",
  "pydantic>=2",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
acp = "acp.cli:main"

[project.urls]
Homepage = "https://github.com/willcode07/agent-credential-platform"
Repository = "https://github.com/willcode07/agent-credential-platform"

[tool.hatch.build.targets.wheel]
packages = ["src/acp"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["acp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
